events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Custom log format for proxy tracking
    log_format dashboard_log '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'to: $upstream_addr';

    access_log /var/log/nginx/dashboard_access.log dashboard_log;
    error_log  /var/log/nginx/dashboard_error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Frontend Dashboard Static Files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ =404;
        }

        # Reverse Proxy to Python Metrics API running on port 6000
        location /api/ {
            proxy_pass http://backend:6000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}