<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Status Dashboard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 40px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { margin: 0; color: #f8fafc; font-size: 1.75rem; }
        .refresh-btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .refresh-btn:hover { background: #2563eb; }
        .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 8px; border: 1px solid #334155; }
        h2 { margin-top: 0; margin-bottom: 15px; color: #38bdf8; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 0.05em; }
        pre { background: #090d16; color: #34d399; padding: 16px; border-radius: 6px; overflow-x: auto; font-family: "Fira Code", Monaco, Consolas, monospace; font-size: 0.9rem; margin: 0; line-height: 1.5; }
        .error { color: #f87171; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Linux Monitoring Dashboard</h1>
            <button class="refresh-btn" onclick="fetchMetrics()">Refresh Now</button>
        </div>
        
        <div class="grid">
            <div class="card">
                <h2>Kernel Info (uname -a)</h2>
                <pre id="uname-output">Loading...</pre>
            </div>

            <div class="card">
                <h2>Network Interfaces (ip addr)</h2>
                <pre id="ip-output">Loading...</pre>
            </div>

            <div class="card">
                <h2>Disk Space Usage (df -h)</h2>
                <pre id="df-output">Loading...</pre>
            </div>

            <div class="card">
                <h2>Critical File Permissions (ls -lrt)</h2>
                <pre id="ls-output">Loading...</pre>
            </div>
        </div>
    </div>

    <script>
        async function fetchMetrics() {
            const targets = {
                'uname-output': 'uname',
                'ip-output': 'ip_addr',
                'df-output': 'df_h',
                'ls-output': 'ls_lrt'
            };
            
            // Set loading state
            Object.keys(targets).forEach(id => document.getElementById(id).textContent = 'Fetching updated metrics...');

            try {
                const response = await fetch('api/status');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const data = await response.json();
                
                Object.entries(targets).forEach(([id, key]) => {
                    document.getElementById(id).textContent = data[key] || 'No data returned';
                });
            } catch (error) {
                console.error('Error fetching metrics:', error);
                Object.keys(targets).forEach(id => {
                    document.getElementById(id).innerHTML = `<span class="error">Failed to load metrics from API proxy.</span>`;
                });
            }
        }

        // Initial fetch and auto-refresh loop every 15 seconds
        fetchMetrics();
        setInterval(fetchMetrics, 15000);
    </script>
</body>
</html>
