services:
  frontend:
    image: monitoring-frontend:1.0
    build: 
      context: ./system-dashboard
      dockerfile: Dockerfile
    container_name: system-dashboard
    ports:
      - 9090:80
    networks:
      - monitoring-app-network
    volumes:
      - nginx-logs:/var/log/nginx
    restart: on-failure:3
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  backend:
    image: monitoring-backend:1.0
    build: 
      context: ./metrics-collector
      dockerfile: Dockerfile
    container_name: metrics-collector
    networks:
      - monitoring-app-network
    volumes:
      - api-logs:/var/log
    restart: on-failure:3
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6000/status"]
      interval: 5s
      retries: 3
      start_period: 5s
      timeout: 3s


networks:
  monitoring-app-network:
    name: monitoring-app-network
    driver: bridge

volumes:
  nginx-logs:
    name: nginx-logs
    driver: local
  api-logs:
    name: api-logs
    driver: local

  